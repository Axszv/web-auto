name: Daily Web Auto (anyrouter)

on:
  schedule:
    # cron 只认 UTC。UTC 22:17 = 北京 06:17 提交，算上 actions 排队延迟实际约北京 08:17 跑，
    # 跨过 a-n-y-router.top 的 UTC 零点（北京 08:00）签到重置线
    - cron: '17 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium firefox

      - name: Install system deps for Firefox
        run: npx playwright install-deps firefox

      - name: Setup virtual display
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1280x800x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Run automation
        run: node auto.js
        env:
          SITES: anyrouter
          DISPLAY: :99
          GH_USER: ${{ secrets.GH_USER }}
          GH_PASS: ${{ secrets.GH_PASS }}
          GH_TOTP_SECRET: ${{ secrets.GH_TOTP_SECRET }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
