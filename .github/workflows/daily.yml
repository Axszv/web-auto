name: Daily Web Auto

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium firefox

      - name: Install system deps for Firefox
        run: npx playwright install-deps firefox

      - name: Setup virtual display
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1280x800x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Run automation
        run: node auto.js
        env:
          DISPLAY: :99
          GOGOCS_EMAIL: ${{ secrets.GOGOCS_EMAIL }}
          GOGOCS_PASSWORD: ${{ secrets.GOGOCS_PASSWORD }}
          GH_USER: ${{ secrets.GH_USER }}
          GH_PASS: ${{ secrets.GH_PASS }}

      - name: Commit and push updated cookies
        run: |
          git config user.email '504740633@qq.com'
          git config user.name 'Axszv'
          git fetch origin main
          git reset --hard origin/main
          git add cookies.json
          git diff --cached --quiet && echo 'No cookie changes' || (git commit -m 'chore: update session cookies [skip ci]' && git push)
