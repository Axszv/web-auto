name: Daily Web Auto

on:
  schedule:
    # UTC 22:17 = 北京 6:17。actions 排队延迟约 1h47m，实际约 UTC 00:04（北京 08:04）跑。
    # a-n-y-router.top 签到按 UTC 零点重置，需实际执行过 UTC 0 点；agentrouter.org 按北京零点重置。
    - cron: '17 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium firefox

      - name: Install system deps for Firefox
        run: npx playwright install-deps firefox

      - name: Restore secrets from environment
        run: |
          # cookies 走 secret，运行时才落盘
          node lib/crypt-decrypt-cli.js cookies.json.enc cookies.json
        env:
          COOKIES_KEY: ${{ secrets.COOKIES_KEY }}

      - name: Setup virtual display
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1280x800x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Run automation
        run: node auto.js
        env:
          DISPLAY: :99
          GH_USER: ${{ secrets.GH_USER }}
          GH_PASS: ${{ secrets.GH_PASS }}
          GH_TOTP_SECRET: ${{ secrets.GH_TOTP_SECRET }}
          COOKIES_KEY: ${{ secrets.COOKIES_KEY }}
          GOGOCS_EMAIL: ${{ secrets.GOGOCS_EMAIL }}
          GOGOCS_PASSWORD: ${{ secrets.GOGOCS_PASSWORD }}

      - name: Commit and push encrypted cookies
        run: |
          # 测试分支：跳过回写 cookies，避免污染 main 的加密 cookie
          rm -f cookies.json
          echo "test/no-proxy: skipping cookie commit"
