name: Daily Web Auto

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run automation
        run: node auto.js
        env:
          GOGOCS_EMAIL: ${{ secrets.GOGOCS_EMAIL }}
          GOGOCS_PASSWORD: ${{ secrets.GOGOCS_PASSWORD }}
          SHAREDCHAT_EMAIL: ${{ secrets.SHAREDCHAT_EMAIL }}
          SHAREDCHAT_PASSWORD: ${{ secrets.SHAREDCHAT_PASSWORD }}

      - name: Commit and push updated cookies
        run: |
          git config user.email 'actions@github.com'
          git config user.name 'GitHub Actions'
          git fetch origin main
          git reset --hard origin/main
          git add cookies.json
          git diff --cached --quiet && echo 'No cookie changes' || (git commit -m 'chore: update session cookies [skip ci]' && git push)