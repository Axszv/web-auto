name: ArityFlow Daily Ads (Redroid ARM64)

on:
  schedule:
    # UTC 01:17 = 北京 09:17，每天 1 次。
    # 刻意压到最低：GDT 侧返回的 109502「该广告位请求量大而收入较低，出于成本考虑降低填充」
    # 说明请求频率本身就会被判为低价值流量 —— 多跑不提高命中率，反而被降填充。
    # 详见 docs/arityflow-ads.md
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      max_ads:
        description: Max ads to watch (0 = only report balance)
        required: false
        default: '2'
        type: string
      ads_attempts:
        description: Clicks on 「看广告」 per round (Sigmob has only 1 slot, each click = one bid). 留空则用脚本默认值（默认 2，低频）
        required: false
        default: ''
        type: string
      ads_retry_wait:
        description: Seconds between bids (too short triggers rate limiting). 留空则用脚本默认值
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  # 按 matrix 索引分组，让不同 IP 的采样能并发跑。原来固定成 arityflow-ads
  # 会把所有 run 串行化 —— 同一时间只有一个 run，永远只能抽到一个出口 IP，
  # 命中概率就固定在单 IP 上。实测 10-02 成功、之后全灭，最可能的解释就是
  # runner IP 池里「干净 IP」的比例波动。
  group: arityflow-ads-${{ github.run_attempt }}-${{ strategy.job-index || 0 }}

jobs:
  ads:
    # ARM64 原生 runner（免费账号可用），Redroid 容器跑 arm64 Android
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # 一次并发采样多个 runner IP。GDT 的 109502「该广告位请求量大而收入较低」
      # 是按 IP 独立统计的，所以分成多个 run 各自少量请求，既避开降填充，
      # 又能覆盖多个不同出口 IP —— 单 IP 死磕的命中率被 IP 池质量锁死了。
      matrix:
        ip_sample: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - name: Cache ArityFlow APK
        id: apk-cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/ArityFlow.apk
          key: arityflow-apk-v130

      - name: Download private APK fixture
        if: steps.apk-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p artifacts
          gh release download arityflow-apk-v130 \
            --pattern ArityFlow.apk \
            --dir artifacts

      - uses: actions/setup-node@v4
        with:
          # Node 22+ 自带 WebSocket，用于 CDP 驱动 WebView
          node-version: '24'

      - name: Install host tools
        shell: bash
        run: |
          mkdir -p diagnostics
          sudo apt-get update
          sudo apt-get install -y adb jq
          uname -a | tee diagnostics/host.txt

      - name: Enable Android Binder devices
        shell: bash
        run: |
          set -euxo pipefail
          if ! sudo modprobe binder_linux; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
            sudo modprobe binder_linux
          fi

      - name: Start native ARM64 Redroid (fake Redmi device)
        env:
          REDROID_IMAGE: 'redroid/redroid:12.0.0_64only-latest'
        shell: bash
        run: |
          docker pull "$REDROID_IMAGE"
          docker run -d --name redroid --privileged \
            -p 5555:5555 \
            --dns 8.8.8.8 --dns 1.1.1.1 \
            "$REDROID_IMAGE" \
            androidboot.redroid_width=1080 \
            androidboot.redroid_height=2400 \
            androidboot.redroid_dpi=420 \
            androidboot.redroid_gpu_mode=guest \
            androidboot.hardware=qcom \
            androidboot.hardware.egl=adreno \
            androidboot.hardware.vulkan=adreno \
            androidboot.product.board=pudding \
            androidboot.board.platform=kalama \
            androidboot.product.cpu.abi=arm64-v8a \
            androidboot.product.locale=zh-CN \
            ro.product.model=25060RK16C \
            ro.product.brand=REDMI \
            ro.product.manufacturer=Xiaomi \
            ro.product.name=Redmi\ K80 \
            ro.product.device=pudding \
            ro.build.product=pudding \
            ro.build.flavor=redmi \
            ro.build.fingerprint=Xiaomi/pudding/pudding:14/UKQ1.230804.001/V14.0.4.0.UJSCN:user/release-keys \
            ro.miui.ui.version.name=HyperOS2.0 \
            ro.product.locale=zh-CN

      - name: Wait for Android boot
        shell: bash
        run: bash scripts/redroid-boot.sh diagnostics

      - name: Probe OAID support in Redroid
        shell: bash
        run: |
          set +e
          bash scripts/probe-oaid.sh diagnostics
          exit 0

      - name: Watch daily rewarded ads
        env:
          IP_SAMPLE: ${{ strategy.job-index }}
          ARITY_USER: ${{ secrets.ARITYFLOW_USER }}
          ARITY_PASS: ${{ secrets.ARITYFLOW_PASSWORD }}
          ARITY_CODE: ${{ secrets.ARITYFLOW_CODE }}
          MAX_ADS: ${{ inputs.max_ads || '3' }}
          # 只在手动指定时导出；不指定则由 scripts/arityflow-ads.sh 里的默认值决定，
          # 避免 env 与脚本默认值不同步（env 优先级更高，会静默覆盖脚本设置）。
          ADS_ATTEMPTS: ${{ inputs.ads_attempts }}
          ADS_RETRY_WAIT: ${{ inputs.ads_retry_wait }}
        shell: bash
        run: |
          if [[ -z "$ARITY_USER" || -z "$ARITY_PASS" ]]; then
            echo "ARITYFLOW_USER / ARITYFLOW_PASSWORD must be set"; exit 1
          fi
          set +e
          timeout --kill-after=15s 100m bash scripts/arityflow-ads.sh \
            artifacts/ArityFlow.apk diagnostics
          exit $?

      - name: Save APK cache
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: artifacts/ArityFlow.apk
          key: arityflow-apk-v130

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arityflow-ads-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
