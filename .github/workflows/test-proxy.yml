name: Test Proxy Connectivity
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== Test proxyip.jp reachable ==="
          curl -s --max-time 10 -o /dev/null -w "proxyip.jp: %{http_code}\n" https://proxyip.jp.cmliussss.net/
          echo "=== Test workers.dev reachable ==="
          curl -s --max-time 10 -o /dev/null -w "workers: %{http_code}\n" https://epic-gcp-relay.lkjh05.workers.dev/
          echo "=== Test anyrouter via sing-box ==="
          curl -s --max-time 15 -o /dev/null -w "anyrouter: %{http_code}\n" https://anyrouter.top/
