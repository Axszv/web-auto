name: Test Proxy Connectivity
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== Testing proxyip domains ==="
          for h in proxyip.us.cmliussss.net proxyip.jp.cmliussss.net proxyip.sg.cmliussss.net proxyip.hk.cmliussss.net proxyip.cmliussss.net; do
            code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' "https://$h/" 2>/dev/null)
            echo "$h: $code"
          done
          echo "=== Testing workers.dev ==="
          code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' "https://epic-gcp-relay.lkjh05.workers.dev/" 2>/dev/null)
          echo "epic-gcp-relay.lkjh05.workers.dev: $code"
          echo "=== Testing direct IP ==="
          code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' "https://104.18.39.209/" -k --resolve new.axs.dpdns.org:443:104.18.39.209 2>/dev/null)
          echo "104.18.39.209: $code"
          echo "=== Testing sni.111000.indevs.in ==="
          code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' "https://sni.111000.indevs.in/" 2>/dev/null)
          echo "sni.111000.indevs.in: $code"
          echo "=== Testing blog API ==="
          curl -s --max-time 10 "https://ipdb.api.030101.xyz/?type=bestproxy&country=true" | head -5
          echo "=== Testing GCP IPs directly ==="
          for ip in 8.212.12.98 155.248.170.249 8.219.243.132 47.254.86.133; do
            code=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' "https://$ip/" -k --resolve epic-gcp-relay.lkjh05.workers.dev:443:$ip 2>/dev/null)
            echo "$ip: $code"
          done
