name: Test Proxy Connectivity
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== Test proxyip domains ==="
          curl -s --max-time 10 -o /dev/null -w "proxyip.us: %{http_code}\n" https://proxyip.us.cmliussss.net/ || echo "proxyip.us: failed"
          curl -s --max-time 10 -o /dev/null -w "proxyip.jp: %{http_code}\n" https://proxyip.jp.cmliussss.net/ || echo "proxyip.jp: failed"
          curl -s --max-time 10 -o /dev/null -w "proxyip.sg: %{http_code}\n" https://proxyip.sg.cmliussss.net/ || echo "proxyip.sg: failed"
          curl -s --max-time 10 -o /dev/null -w "proxyip.hk: %{http_code}\n" https://proxyip.hk.cmliussss.net/ || echo "proxyip.hk: failed"
          echo "=== Test workers.dev ==="
          curl -s --max-time 10 -o /dev/null -w "workers: %{http_code}\n" https://epic-gcp-relay.lkjh05.workers.dev/ || echo "workers: failed"
          echo "=== Test indevs ==="
          curl -s --max-time 10 -o /dev/null -w "indevs: %{http_code}\n" https://sni.111000.indevs.in/ || echo "indevs: failed"
          echo "=== Test direct IP ==="
          curl -s --max-time 10 -o /dev/null -w "direct: %{http_code}\n" https://104.18.39.209/ -k --resolve new.axs.dpdns.org:443:104.18.39.209 || echo "direct: failed"
