name: Test Proxy Connectivity
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== Test epic-gcp-relay workers ==="
          curl -sv "https://epic-gcp-relay.lkjh05.workers.dev/" 2>&1 | grep -iE '< |> HTTP|location|server|cf-' | head -20
          echo "=== Test blog API ==="
          curl -s "https://ipdb.api.030101.xyz/?type=bestproxy&country=true" | head -3
          echo "=== Test anyrouter without proxy ==="
          curl -s --max-time 10 -o /dev/null -w "anyrouter direct: %{http_code}\n" https://anyrouter.top/
          echo "=== Test agentrouter without proxy ==="
          curl -s --max-time 10 -o /dev/null -w "agentrouter direct: %{http_code}\n" https://agentrouter.org/
