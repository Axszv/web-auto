<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="user-scalable=no,initial-scale=1,width=device-width,height=device-height"/>
    <title id="a">加载失败</title>
    <style type="text/css">
        html, body {width: 100%;height: 100%;margin: 0;padding: 0;}
        @media all and (orientation : portrait) {
            body > div {width: 30%;margin: 0 auto;padding-top: 40%;}
            p {margin-top: 8%;}
            button {margin-top: 15%;}
        }
        @media all and (orientation : landscape) {
            body > div {width: 15%;margin: 0 auto;padding-top: 10%;}
            p {margin-top: 3%;}
            button {margin-top: 3%;}
        }
        img {width: 100%;}
        p {text-align: center;font-size: 18px;color: #888;}
        button {border: 1px solid #ccc;padding: 10px 15px;background: #fff;font-size:14px;}
    </style>
    <script>
        function doLoad() {
            var lg = navigator.language;
            if (lg && (lg.indexOf("zh") != 0)) {
                document.getElementById("a").innerText ="Load Failed";
                document.getElementById("b").innerText ="No Network Connection";
                document.getElementById("c").innerText ="Reload";
            }
        }
        function reload() {
            var url = location.href;
            var idx = url.indexOf("?url=");
            if (idx >= 0) {
                url = decodeURIComponent(url.substring(idx + 5));
                location.replace(url);
            }
        }
    </script>
</head>
<body onload="doLoad()">
    <div><img src="image/no-network.png"/></div>
    <p id="b">没有网络连接</p>
    <p><button onclick="reload()" id="c">重新加载</button></p>
</body>
</html>
